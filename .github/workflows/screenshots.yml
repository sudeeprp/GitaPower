name: Android Screenshots
# source: https://github.com/marketplace/actions/android-emulator-runner

on: 
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./feeder
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
      - run: flutter --version
      - name: Install dependencies
        run: flutter pub get

      - name: setup offline content
        run: bash gita-begin-offline.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: ./feeder
          api-level: 29
          script: flutter drive --driver=test_driver/screenshot_driver.dart --target=integration_test/integ_test.dart

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: feeder/screenshots
